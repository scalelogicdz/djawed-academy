name: Support email checks
on:
  pull_request:
    paths:
      - 'app/api/support/route.ts'
      - 'lib/supportEmails.ts'
      - 'tests/support-emails.test.cjs'
      - '.github/workflows/support-emails.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/support-emails.test.cjs tests/community-emails.test.cjs tests/lesson-emails.test.cjs
      - run: npx tsc --noEmit
