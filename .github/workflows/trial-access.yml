name: Trial access security checks
on:
  push:
    branches: [main]
    paths: ['lib/trialAccess.ts', 'components/Trial*.tsx', 'app/**', 'components/StudentsManager.tsx', 'components/StudentNav.tsx', 'components/CourseAccordion.tsx', 'proxy.ts', 'supabase/trial-access.sql', 'tests/trial-access*', '.github/workflows/trial-access.yml']
  pull_request:
    paths: ['lib/trialAccess.ts', 'components/Trial*.tsx', 'supabase/trial-access.sql', 'tests/trial-access*']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit --incremental false
      - run: node --test tests/*.test.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts @electric-sql/pglite@0.3.14
      - run: node --test tests/trial-access-db.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
