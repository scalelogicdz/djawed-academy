*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#15365e;font-family:'Cairo',sans-serif;background-color:#fbfdff;background-image:linear-gradient(#0866ff06 1px,transparent 1px),linear-gradient(90deg,#0866ff06 1px,transparent 1px);background-size:32px 32px}header{text-align:center;padding:36px 20px 28px}header a{font-size:27px;font-weight:900;text-decoration:none;color:#15365e}header span{color:#0866ff}main{width:min(460px,calc(100% - 36px));margin:0 auto 48px;padding:28px;border:1px solid #c9dfff;border-radius:22px;background:#fff;box-shadow:0 16px 40px -25px #075edc55}.eyebrow{text-align:center;margin:0;color:#0866ff;font-weight:700;font-size:16px}h1{text-align:center;font-size:32px;line-height:1.5;margin:8px 0 22px}.price{background:linear-gradient(120deg,#edf8ff,#eaf3ff);border-radius:16px;text-align:center;padding:16px;margin-bottom:26px}.amount{display:flex;justify-content:center;align-items:baseline;gap:8px;color:#0866ff;line-height:1.2}.amount strong{font-size:44px;font-weight:900}.amount span{font-size:23px;font-weight:700}.price p{font-size:15px;margin:8px 0 0}label{display:block;font-size:16px;font-weight:700;margin-bottom:9px}.field{margin-bottom:20px}input{display:block;width:100%;height:54px;border:1px solid #9cbbdf;border-radius:11px;background:white;color:#15365e;font:inherit;padding:10px 14px;outline:none}input:focus{border-color:#0866ff;box-shadow:0 0 0 3px #0866ff16}button{display:block;width:100%;border:0;border-radius:12px;background:#0866ff;color:white;font:800 19px 'Cairo',sans-serif;padding:14px;cursor:pointer;margin-top:26px}button:hover{background:#075edc}button:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #87b7ff;outline-offset:3px}[hidden]{display:none!important}.error{color:#b42318;font-size:14px;margin:8px 0}#confirmation{text-align:center;padding:30px 0}#confirmation h2{font-size:25px}#confirmation p{line-height:1.9}@media(max-width:380px){main{padding:22px}h1{font-size:28px}}

<header><a href="/recorded-course-landing-v2.html" dir="ltr">Djawed <span>Logic</span></a></header>
<main><form id="registrationForm">
<p class="eyebrow">دورة السبونسور</p><h1>سجّل في الدورة</h1>
<div class="price"><div class="amount"><strong dir="ltr">7,500</strong><span>دج</span></div><p>وصول مدى الحياة</p></div>
<div class="field"><label for="fieldName">الاسم الكامل</label><input id="fieldName" name="name" type="text" autocomplete="name" required minlength="2" maxlength="120"></div>
<div class="field"><label for="fieldWhatsapp">رقم الهاتف / واتساب</label><input id="fieldWhatsapp" name="whatsapp" type="tel" dir="ltr" autocomplete="tel" inputmode="tel" required maxlength="30" aria-describedby="waError"><p id="waError" class="error" hidden>الرجاء إدخال رقم هاتف صحيح</p></div>
<p id="submitError" class="error" role="alert" style="display:none">حدث خطأ أثناء الإرسال، الرجاء المحاولة مرة أخرى</p>
<button id="submitBtn" type="submit">أرسل طلب التسجيل</button>
</form><section id="confirmation" role="status" hidden><h2>وصلنا طلبك بنجاح</h2><p>راح نتواصلو معاك قريبًا عبر واتساب.</p></section></main>
<script>
(function(){
var form=document.getElementById('registrationForm'),nameField=document.getElementById('fieldName'),waField=document.getElementById('fieldWhatsapp'),submitBtn=document.getElementById('submitBtn');
var submissionInFlight=false,leadTracked=false;
function normalizePhone(raw){
 var s=raw.trim().replace(/[٠-٩]/g,function(d){return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d));}).replace(/[\s().-]/g,'');
 if(s.indexOf('00')===0)s='+'+s.slice(2);
 if(/^0[567]\d{8}$/.test(s))s='+213'+s.slice(1);
 else if(/^[567]\d{8}$/.test(s))s='+213'+s;
 else if(/^213[567]\d{8}$/.test(s))s='+'+s;
 return /^\+[1-9]\d{7,14}$/.test(s)?s:'';
}
waField.addEventListener('input',function(){document.getElementById('waError').hidden=true;waField.removeAttribute('aria-invalid');});
form.addEventListener('submit',function(event){
 event.preventDefault();if(submissionInFlight)return;
 if(!form.reportValidity())return;
 var phone=normalizePhone(waField.value);
 if(!phone){document.getElementById('waError').hidden=false;waField.setAttribute('aria-invalid','true');waField.focus();return;}
 var answers={name:nameField.value.trim(),whatsapp:phone};
 if(answers.name.length<2){nameField.focus();return;}
 submissionInFlight=true;submitBtn.disabled=true;
 var submitError=document.getElementById('submitError');submitError.style.display='none';submitBtn.textContent='جارٍ الإرسال...';
    var params = new URLSearchParams(window.location.search);
    var source = params.get('utm_source') || '';
    var sourceLower = source.toLowerCase();

    if(!source){
      if(params.get('ttclid')) source = 'TikTok';
      else if(params.get('fbclid')) source = 'Meta';
      else source = 'Organic';
    } else if(sourceLower.indexOf('tiktok') !== -1){
      source = 'TikTok';
    } else if(sourceLower.indexOf('meta') !== -1 || sourceLower.indexOf('facebook') !== -1 || sourceLower.indexOf('instagram') !== -1){
      source = 'Meta';
    }

    var crmPayload = {
      name: answers.name,
      whatsapp: answers.whatsapp,
      source: source,
      campaign: params.get('utm_campaign') || '',
      adset: params.get('utm_content') || params.get('adset') || params.get('adgroup') || '',
      ad: params.get('utm_term') || params.get('ad') || '',
      stage: '',
      level: '',
      obstacle: '',
      desiredOutcome: '',
      contactTime: '',
      fbclid: params.get('fbclid') || '',
      ttclid: params.get('ttclid') || '',
      landingUrl: document.referrer || window.location.href
    };

    var formspreeRequest = fetch('https://formspree.io/f/xrpglrlw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        'الاسم': answers.name,
        'واتساب': answers.whatsapp,
        'المصدر': source,
        'الحملة': crmPayload.campaign,
        'Ad Set / Ad Group': crmPayload.adset,
        'الإعلان': crmPayload.ad,
        'fbclid': crmPayload.fbclid,
        'ttclid': crmPayload.ttclid
      })
    }).then(function(response){
      if(!response.ok) throw new Error('formspree failed');
      return true;
    });

    var crmRequest = fetch('/api/leads', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(crmPayload)
    }).then(function(response){
      if(!response.ok) throw new Error('crm failed');
      return true;
    });

    Promise.allSettled([crmRequest, formspreeRequest])
      .then(function(results){
        var crmOk = results[0].status === 'fulfilled';
        var formspreeOk = results[1].status === 'fulfilled';

        if(!crmOk && !formspreeOk){
          throw new Error('all submissions failed');
        }

        // Conversion events are tied to the CRM write, so Ads Manager cannot
        // count a lead that never reached the primary lead database.
        if(crmOk && !leadTracked){
          leadTracked = true;
          if(typeof fbq === 'function'){ fbq('track', 'Lead'); }
          if(typeof ttq !== 'undefined' && typeof ttq.track === 'function'){ ttq.track('Lead'); }
        }

        submissionInFlight = false;
        form.hidden = true;
        document.getElementById('confirmation').hidden = false;
      })
      .catch(function(){
        submissionInFlight = false;
        submitError.style.display = 'block';
        submitBtn.textContent = 'أرسل طلب التسجيل';
        submitBtn.disabled = false;
      });
  });

})();
</script></body></html>
